name: CI
on:
  push:
  pull_request:

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + lint + unit + database tests
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no browsers for ubuntu-latest (26.04)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Formatting (run `npm run format` to fix)
        run: npm run format:check
      # pricing (incl. 2,000 random carts), the status machine, PIN lockout, and the real
      # Supabase migrations run in an in-memory Postgres (tests/unit/db.test.ts)
      - run: npm test
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  db:
    name: Database code on a real Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DB_TEST_URL: http://localhost:3000
      DB_TEST_JWT_SECRET: test-only-secret-for-ci-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up the database the way Supabase does, then run our migrations in order
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/support/db-roles.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/support/db-grants.sql
      - name: Start PostgREST (the REST layer Supabase puts in front of Postgres)
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:postgres@localhost:5432/postgres \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$DB_TEST_JWT_SECRET" -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          docker logs postgrest; exit 1
      # The same store contract the in-memory store passes, now through lib/store/supabase.ts
      - run: npm run test:db
      - if: failure()
        run: docker logs postgrest

  e2e:
    name: Browser tests (kiosk, kitchen, board, API, failures)
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no browsers for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds once, then runs three servers on the in-memory store (never the real database).
      - run: npm run e2e
        env:
          CI: '1'
      - name: Keep the report and traces when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
