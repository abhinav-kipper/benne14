name: CI
on:
  push:
  pull_request:

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + unit + database tests
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no browsers for ubuntu-latest (26.04)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # pricing (incl. 2,000 random carts), the status machine, PIN lockout, and the real
      # Supabase migrations run in an in-memory Postgres (tests/unit/db.test.ts)
      - run: npm test
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser tests (kiosk, kitchen, board, API, failures)
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no browsers for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds once, then runs three servers on the in-memory store (never the real database).
      - run: npm run e2e
        env:
          CI: '1'
      - name: Keep the report and traces when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
