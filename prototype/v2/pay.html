<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pay</title><link rel="stylesheet" href="theme.css"><style>
.top{padding:28px 32px}
.amt{padding:20px 32px 30px}
.amt h1{font-size:72px;font-weight:800;letter-spacing:-.04em;margin-top:6px}
.amt p{font-size:19px;color:var(--ink-2);margin-top:4px}
.opts{padding:0 32px;display:flex;flex-direction:column;gap:16px}
.o{background:var(--card);border-radius:var(--r-xl);padding:28px;display:flex;align-items:center;gap:24px;box-shadow:var(--lift);text-align:left}
.o .ic{width:88px;height:88px;border-radius:var(--r-l);display:grid;place-items:center;flex-shrink:0}
.o .ic svg{width:44px;height:44px}
.o b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.o span{display:block;font-size:17px;color:var(--ink-2);margin-top:4px}
.o .arr{margin-left:auto;font-size:30px;color:var(--ink-3)}
.o.main{box-shadow:inset 0 0 0 2.5px var(--green),var(--lift)}
.o.main .ic{background:var(--green);color:#fff}
.o .ic.c{background:var(--soft);color:var(--ink)}
.rec{font-size:13px;font-weight:700;background:var(--butter-soft);color:var(--on-butter);padding:5px 10px;border-radius:var(--pill);display:inline-block!important;margin:0 0 8px!important}
.note{margin-top:auto;padding:28px 32px;text-align:center;font-size:16px;color:var(--ink-3)}
</style></head><body><div class="screen">
<div class="top"><button class="back">← Your order</button></div>
<div class="amt"><div class="label">Amount to pay</div><h1>₹330</h1><p>3 items · Eat here</p></div>
<div class="opts">
<button class="o main"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg></span><div><span class="rec">Fastest</span><b>Scan UPI QR</b><span>Google Pay, PhonePe, Paytm or any UPI app</span></div><span class="arr">→</span></button>
<button class="o"><span class="ic c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg></span><div><b>Card at the counter</b><span>Take your token and pay by card</span></div><span class="arr">→</span></button>
<button class="o"><span class="ic c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg></span><div><b>Cash at the counter</b><span>Take your token and pay in cash</span></div><span class="arr">→</span></button>
</div>
<p class="note">Your food goes to the kitchen as soon as you pay.</p>
</div></body></html>
