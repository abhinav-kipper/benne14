<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Menu B — tabs + list</title><link rel="stylesheet" href="theme.css"><style>
header{padding:32px 32px 0;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:10px;padding:24px 32px 20px;border-bottom:1px solid var(--line)}
.tab{height:58px;padding:0 26px;border-radius:var(--pill);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card)}
.tab.on{background:var(--green);color:var(--on-green);box-shadow:none}
.list{padding:8px 32px 140px;overflow:hidden}
.sec{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 6px}
.item{display:grid;grid-template-columns:128px 1fr auto;gap:22px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item .ph{width:128px;height:128px;border-radius:var(--r-m);overflow:hidden}.item img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:21px;font-weight:700;letter-spacing:-.01em}
.item p{font-size:16px;color:var(--ink-2);margin:6px 0 10px;line-height:1.45}
.item .price{font-size:21px}
</style></head><body><div class="screen">
<header><div class="mark"><span class="seal">14</span><div><b>Benne 14</b><small>Authentic Bangalore dosa</small></div></div><span class="label">Order here</span></header>
<div class="tabs" id="tabs"></div><div class="list" id="l"></div>
<div class="cartbar"><span class="n">3</span><span class="t">items · ₹314</span><span class="go">View order →</span></div>
</div><script src="data.js"></script><script>
tabs.innerHTML=MENU.categories.map((c,i)=>`<span class="tab ${i?'':'on'}">${c.name}</span>`).join('');
l.innerHTML='<div class="sec">Dosas</div>'+MENU.items.filter(i=>i.cat=='dosa').map(it=>`<div class="item"><div class="ph">${img(it)}</div><div><h3><span class="veg"></span>${it.name}</h3><p>${it.desc}</p><span class="price">₹${it.price}<span class="was">₹${it.mrp}</span></span></div>${ctl(it)}</div>`).join('')+'<div class="sec">Idli &amp; Vada</div>'+MENU.items.filter(i=>i.cat=='idli').slice(0,2).map(it=>`<div class="item"><div class="ph">${img(it)}</div><div><h3><span class="veg"></span>${it.name}</h3><p>${it.desc}</p><span class="price">₹${it.price}<span class="was">₹${it.mrp}</span></span></div>${ctl(it)}</div>`).join('');
</script></body></html>
