<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Order placed</title><link rel="stylesheet" href="theme.css"><style>
.c{flex:1;display:flex;flex-direction:column;align-items:center;padding:56px 48px 32px;text-align:center}
.ok{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800}
h1{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:22px}
.c>p{font-size:19px;color:var(--ink-2);margin-top:8px}
.tok{margin-top:40px;width:520px;background:var(--card);border-radius:var(--r-xl);box-shadow:var(--lift);overflow:hidden}
.tok .l{padding:22px 28px 0;display:flex;justify-content:space-between}
.tok .num{font-size:150px;font-weight:800;letter-spacing:-.05em;line-height:1;padding:10px 0 20px;color:var(--green)}
.tok .f{display:flex;justify-content:space-between;padding:18px 28px;background:var(--butter-soft);font-size:18px;font-weight:700;color:var(--on-butter)}
.steps{margin-top:44px;width:600px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.st{padding-top:16px;border-top:4px solid var(--line);font-size:16px;color:var(--ink-3);font-weight:600}
.st.done{border-color:var(--green);color:var(--ink)}
.st.now{border-color:var(--butter);color:var(--ink)}
.st small{display:block;font-weight:500;font-size:14px;margin-top:4px;color:var(--ink-3)}
.foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center}
.foot span{font-size:16px;color:var(--ink-3)}
.foot .btn{width:220px;justify-content:center}
</style></head><body><div class="screen">
<div class="c"><div class="ok">✓</div><h1>Thank you, Rahul!</h1><p>Payment received · ₹330 via UPI</p>
<div class="tok"><div class="l"><span class="label">Your token</span><span class="label">Eat here</span></div><div class="num">A-042</div><div class="f"><span>3 items</span><span>Ready in about 8 min</span></div></div>
<div class="steps"><div class="st done">Order received<small>Sent to kitchen</small></div><div class="st now">Cooking<small>On the tawa now</small></div><div class="st">Ready<small>Collect at the counter</small></div></div>
<p style="margin-top:36px;font-size:18px;color:var(--ink-2)">Watch the screen by the counter. We'll show <b style="color:var(--ink)">A-042</b> when it's ready.</p>
<div class="foot"><span>New order starts in 12 seconds</span><button class="btn">Done</button></div></div>
</div></body></html>
