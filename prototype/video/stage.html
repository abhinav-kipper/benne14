<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Benne 14 — Walkthrough stage</title>
<link rel="stylesheet" href="../theme.css">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B0B09}
  .stage{position:relative;width:1920px;height:1080px;background:radial-gradient(1200px 800px at 75% 50%,#1D1B16 0%,#0B0B09 70%)}

  .cap{position:absolute;left:110px;top:300px;width:560px;transition:opacity .3s}
  .cap .n{font-family:var(--display);font-weight:900;font-size:150px;line-height:.8;color:var(--benne)}
  .cap .en{font-family:var(--display);font-weight:900;font-size:84px;line-height:.86;text-transform:uppercase;margin-top:26px;height:146px;white-space:nowrap}
  .cap .hi{font-family:var(--hi);font-size:40px;color:var(--cream);margin-top:24px;line-height:1.3;height:52px;white-space:nowrap}
  .cap .sub{font-size:24px;color:var(--cream-2);margin-top:22px;line-height:1.45;max-width:520px;height:70px}
  .brand{position:absolute;left:110px;top:64px;font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;text-transform:uppercase;opacity:0;transition:opacity .2s}
  .brand .bw{display:inline-block;line-height:.8}
  .brand i{font-style:normal;color:var(--benne)}
  .brand small{display:block;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--cream-3);margin-top:12px}
  .prog{position:absolute;left:110px;bottom:64px;display:flex;gap:8px}
  .prog i{width:34px;height:5px;border-radius:3px;background:#2F2C26}
  .prog i.on{background:var(--benne)}

  .dev{position:absolute;transition:opacity .35s, transform .35s}
  .dev.hide{opacity:0;transform:translateY(16px)}
  .bezel{background:#1A1915;border-radius:46px;padding:18px;box-shadow:0 0 0 2px #2C2A24,0 60px 120px -40px rgba(0,0,0,.9)}
  .bezel.tv{border-radius:14px;padding:12px}
  .clip{overflow:hidden;border-radius:28px;background:#121210}
  .tv .clip{border-radius:4px}
  iframe{border:0;display:block;transform-origin:0 0}
  .stand{width:220px;height:70px;margin:0 auto;background:linear-gradient(#1A1915,#121210);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}

  .finger{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(244,236,221,.82);box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 3px rgba(18,18,16,.35);pointer-events:none;opacity:0;transition:left .55s cubic-bezier(.4,.1,.2,1),top .55s cubic-bezier(.4,.1,.2,1),opacity .25s,transform .12s;z-index:20}
  .finger.down{transform:scale(.78)}
  .ring{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:4px solid var(--benne);pointer-events:none;z-index:19;animation:ring .6s ease-out forwards}
  @keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}

  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,11,9,1);z-index:30;transition:background-color .8s}
  .card > *:not(.w){transition:opacity .4s}
  .card .w{display:inline-block;transform-origin:0 0}
  .card.hide{display:none}
  .card .w{font-family:var(--display);font-weight:900;font-size:220px;line-height:.8;text-transform:uppercase}
  .card .w i{font-style:normal;color:var(--benne)}
  .card .t{font-family:var(--body);font-size:20px;font-weight:600;letter-spacing:.3em;color:var(--cream-3);margin-top:26px;text-transform:uppercase}
  .card .h{font-family:var(--hi);font-size:46px;margin-top:40px}
  .card .s{font-size:24px;color:var(--cream-2);margin-top:16px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand" id="brand"><span class="bw">Benne <i>14</i></span><small>PROTOTYPE WALKTHROUGH</small></div>
  <div class="cap" id="cap"><div class="n"></div><div class="en"></div><div class="hi"></div><div class="sub"></div></div>
  <div class="prog" id="prog"></div>
  <div class="dev hide" id="dev"><div class="bezel" id="bezel"><div class="clip" id="clip"><iframe id="f"></iframe></div></div><div class="stand" id="stand" style="display:none"></div></div>
  <div class="finger" id="finger"></div>
  <div class="card" id="card"><div class="w">Benne <i>14</i></div><div class="t">Authentic Bangalore Dosa · Indirapuram</div><div class="h">ऑर्डर से टोकन तक, एक नज़र में</div><div class="s">Self-order kiosk · Kitchen display · TV order board</div></div>
</div>
<script>
  const DEV = {
    kiosk:   { w:800,  h:1280, s:0.735, x:1010, y:50,  tv:false },
    kitchen: { w:1280, h:800,  s:0.84,  x:760,  y:186, tv:false },
    board:   { w:1920, h:1080, s:0.58,  x:740,  y:170, tv:true  },
  };
  const f = document.getElementById('f'), dev = document.getElementById('dev');
  let cur = null;
  window.stage = {
    total: 9,
    async show(kind, src) {
      dev.classList.add('hide');
      await new Promise(r => setTimeout(r, 350));
      const d = DEV[kind]; cur = d;
      f.style.width = d.w + 'px'; f.style.height = d.h + 'px'; f.style.transform = `scale(${d.s})`;
      const clip = document.getElementById('clip'); clip.style.width = d.w*d.s + 'px'; clip.style.height = d.h*d.s + 'px';
      document.getElementById('bezel').className = 'bezel' + (d.tv ? ' tv' : '');
      document.getElementById('stand').style.display = d.tv ? '' : 'none';
      dev.style.left = d.x + 'px'; dev.style.top = d.y + 'px';
      await new Promise(r => { f.onload = r; f.src = src; });
      await f.contentDocument?.fonts?.ready;
      await new Promise(r => setTimeout(r, 250));
      dev.classList.remove('hide');
      await new Promise(r => setTimeout(r, 350));
    },
    async go(src, prep) {   // navigate inside the current device with a quick fade; prep runs before it shows
      f.style.transition = 'opacity .22s'; f.style.opacity = 0;
      await new Promise(r => setTimeout(r, 220));
      await new Promise(r => { f.onload = r; f.src = src; });
      await f.contentDocument?.fonts?.ready;
      if (prep) new Function('d', 'w', prep)(f.contentDocument, f.contentWindow);
      await new Promise(r => setTimeout(r, 120));
      f.style.opacity = 1;
      await new Promise(r => setTimeout(r, 240));
    },
    caption(n, en, hi, sub) {
      const c = document.getElementById('cap');
      c.style.opacity = 0;
      setTimeout(() => {
        c.querySelector('.n').textContent = String(n).padStart(2, '0');
        c.querySelector('.en').innerHTML = en; c.querySelector('.hi').textContent = hi; c.querySelector('.sub').textContent = sub || '';
        document.getElementById('prog').innerHTML = Array.from({length:this.total},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
        c.style.opacity = 1;
      }, 300);
    },
    // x,y are in the device screen's own pixels
    toPage(x, y) { const r = f.getBoundingClientRect(); return [r.left + x*cur.s, r.top + y*cur.s]; },
    async tap(x, y) {
      const [px, py] = this.toPage(x, y), fg = document.getElementById('finger');
      fg.style.opacity = 1; fg.style.left = px + 'px'; fg.style.top = py + 'px';
      await new Promise(r => setTimeout(r, 620));
      fg.classList.add('down');
      const ring = document.createElement('div'); ring.className = 'ring'; ring.style.left = px + 'px'; ring.style.top = py + 'px';
      document.getElementById('stage').appendChild(ring); setTimeout(() => ring.remove(), 650);
      await new Promise(r => setTimeout(r, 140));
      fg.classList.remove('down');
      await new Promise(r => setTimeout(r, 160));
    },
    hideFinger() { document.getElementById('finger').style.opacity = 0; },
    // Title cards morph into / out of the corner logo so the brand never jumps in size.
    async card(show, html) {
      const c = document.getElementById('card'), brand = document.getElementById('brand');
      if (html) c.innerHTML = html;
      const w = c.querySelector('.w'), others = [...c.children].filter(x => x !== w);
      const toBrand = () => { w.style.transform = 'none'; const r1 = w.getBoundingClientRect(), r2 = brand.querySelector('.bw').getBoundingClientRect(), k = r2.height / r1.height;
        return `translate(${r2.left - r1.left}px,${r2.top - r1.top}px) scale(${k})`; };
      const ease = 'transform .9s cubic-bezier(.65,0,.25,1)';
      if (!show) {
        w.style.transition = 'none'; const t = toBrand(); void w.offsetWidth;
        w.style.transition = ease; others.forEach(o => o.style.opacity = 0); c.style.backgroundColor = 'rgba(11,11,9,0)';
        w.style.transform = t;
        await new Promise(r => setTimeout(r, 900));
        brand.style.opacity = 1; c.classList.add('hide');
      } else {
        c.classList.remove('hide'); c.style.backgroundColor = 'rgba(11,11,9,0)';
        w.style.transition = 'none'; others.forEach(o => { o.style.transition = 'none'; o.style.opacity = 0; });
        w.style.transform = toBrand(); void w.offsetWidth;
        brand.style.opacity = 0; this.hideFinger();
        w.style.transition = ease; c.style.backgroundColor = 'rgba(11,11,9,1)'; w.style.transform = 'none';
        await new Promise(r => setTimeout(r, 900));
        others.forEach(o => { o.style.transition = 'opacity .5s'; o.style.opacity = 1; });
      }
    },
    win() { return f.contentWindow; },
    doc() { return f.contentDocument; },
  };
</script>
</body>
</html>
