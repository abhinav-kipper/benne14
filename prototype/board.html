<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Benne 14 — Order board</title>
<link rel="stylesheet" href="theme.css">
<style>
  .screen{width:1920px;height:1080px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:96px 1fr 150px;overflow:hidden;background:#0D0D0B}
  .top{grid-column:1/3;display:flex;align-items:center;padding:0 48px;border-bottom:1px solid var(--line)}
  .logo{font-family:var(--display);font-weight:900;font-size:52px;text-transform:uppercase;line-height:1}
  .logo i{font-style:normal;color:var(--benne)}
  .logo small{font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:.2em;color:var(--cream-3);margin-left:16px;vertical-align:middle}
  .top .clock{margin-left:auto;font-family:var(--display);font-weight:800;font-size:48px;color:var(--cream-2)}

  .zh{display:flex;align-items:center;gap:18px;margin-bottom:28px}
  .zh .ic{width:68px;height:68px;border-radius:18px;display:grid;place-items:center}
  .zh .ic svg{width:40px;height:40px}
  .zh b{font-family:var(--display);font-weight:900;font-size:64px;text-transform:uppercase;line-height:.9}
  .zh .hi{font-size:34px;color:var(--cream-2);margin-left:6px}

  /* ready */
  .ready{padding:40px 48px;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .ready .ic{background:var(--benne);color:var(--benne-ink)}
  .hero{display:flex;align-items:center;gap:40px}
  .tkt{background:var(--benne);color:var(--benne-ink);border-radius:26px;position:relative;box-shadow:0 40px 80px -30px rgba(245,197,66,.45)}
  .tkt::before,.tkt::after{content:"";position:absolute;bottom:86px;width:40px;height:40px;border-radius:50%;background:#0D0D0B}
  .tkt::before{left:-20px}.tkt::after{right:-20px}
  .tkt .num{font-family:var(--display);font-weight:900;line-height:.8;padding:34px 44px 30px;white-space:nowrap}
  .tkt .perf{height:3px;margin:0 26px;background-image:linear-gradient(90deg,var(--benne-ink) 50%,transparent 50%);background-size:18px 3px;opacity:.3}
  .tkt .nm{padding:22px 44px 28px;font-size:40px;font-weight:700}
  .hero .tkt{transform:rotate(-2deg)}
  .hero .tkt .num{font-size:250px}
  .callout{font-family:var(--hi);font-size:52px;line-height:1.25;min-width:330px}
  .callout b{color:var(--benne);font-weight:400}
  .callout small{display:block;font-family:var(--body);font-size:26px;color:var(--cream-2);margin-top:14px}
  .more{display:flex;gap:28px;margin-top:auto}
  .more .tkt{flex:1;background:#E9D9A6}
  .more .tkt::before,.more .tkt::after{bottom:70px;width:30px;height:30px}
  .more .tkt::before{left:-15px}.more .tkt::after{right:-15px}
  .more .tkt .num{font-size:130px;padding:24px 30px 20px}
  .more .tkt .nm{font-size:28px;padding:16px 30px 20px}

  /* preparing */
  .prep{padding:40px 48px}
  .prep .ic{background:rgba(226,96,63,.18);color:var(--chilli)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
  .pc{height:164px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;min-width:0}
  .pc .num{font-family:var(--display);font-weight:900;font-size:84px;line-height:.8;color:var(--cream);white-space:nowrap}
  .pc .dots{margin-left:auto;display:flex;gap:7px}
  .pc .dots i{width:12px;height:12px;border-radius:50%;background:var(--s3)}
  .pc .dots i.f{background:var(--chilli)}
  .pc.soon{border-color:rgba(245,197,66,.35)}
  .pc.soon .dots i.f{background:var(--benne)}

  /* promo strip */
  .promo{grid-column:1/3;display:flex;align-items:center;gap:30px;padding:0 48px;background:var(--s1);border-top:1px solid var(--line)}
  .promo img{width:110px;height:110px;border-radius:18px;object-fit:cover}
  .promo .t{font-family:var(--display);font-weight:900;font-size:56px;text-transform:uppercase;line-height:.9}
  .promo .hi{font-size:30px;color:var(--cream-2);margin-top:6px}
  .promo .p{margin-left:auto;display:flex;align-items:baseline;gap:14px}
  .promo .p b{font-family:var(--display);font-weight:900;font-size:80px;color:var(--benne)}
  .promo .p s{font-family:var(--display);font-weight:700;font-size:36px;color:var(--cream-3)}
  .promo .dots{display:flex;gap:10px;margin-left:40px}
  .promo .dots i{width:12px;height:12px;border-radius:50%;background:var(--s3)}
  .promo .dots i.on{background:var(--cream)}

  /* entrance for a newly ready token */
  @keyframes pop{0%{transform:rotate(-2deg) scale(.6);opacity:0}60%{transform:rotate(-3deg) scale(1.06);opacity:1}100%{transform:rotate(-2deg) scale(1)}}
  @keyframes glow{0%,100%{box-shadow:0 40px 80px -30px rgba(245,197,66,.45)}50%{box-shadow:0 0 0 18px rgba(245,197,66,.18),0 40px 90px -20px rgba(245,197,66,.7)}}
  .hero .tkt.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both, glow 1.4s ease-in-out .7s 3}
  @keyframes fadeout{to{opacity:0;transform:scale(.9)}}
  .pc.leaving{animation:fadeout .5s forwards}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="bell" viewBox="0 0 34 34"><g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M4 26h26M7 26a10 10 0 0 1 20 0M17 13v3M14 10h6"/></g></symbol>
  <symbol id="flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></symbol>
</svg>
<div class="screen">
  <div class="top"><div class="logo">Benne <i>14</i><small>AUTHENTIC BANGALORE DOSA</small></div><div class="clock">12:44</div></div>

  <section class="ready">
    <div class="zh"><span class="ic"><svg><use href="#bell"/></svg></span><b>Ready</b><span class="hi">काउंटर से ले लीजिए</span></div>
    <div class="hero" id="hero">
      <div class="tkt"><div class="num">A-041</div><div class="perf"></div><div class="nm">Table order</div></div>
      <div class="callout">गरमा-गरम <b>तैयार</b> है!<small>Please collect from the counter</small></div>
    </div>
    <div class="more" id="more">
      <div class="tkt"><div class="num">A-039</div><div class="perf"></div><div class="nm">Aman</div></div>
      <div class="tkt"><div class="num">A-038</div><div class="perf"></div><div class="nm">Table order</div></div>
    </div>
  </section>

  <section class="prep">
    <div class="zh"><span class="ic"><svg><use href="#flame"/></svg></span><b>On the tawa</b><span class="hi">बन रहा है</span></div>
    <div class="grid" id="prep">
      <div class="pc soon" data-t="A-040"><span class="num">A-040</span><span class="dots"><i class="f"></i><i class="f"></i><i class="f"></i></span></div>
      <div class="pc soon" data-t="A-042"><span class="num">A-042</span><span class="dots"><i class="f"></i><i class="f"></i><i></i></span></div>
      <div class="pc" data-t="A-044"><span class="num">A-044</span><span class="dots"><i class="f"></i><i></i><i></i></span></div>
      <div class="pc" data-t="A-045"><span class="num">A-045</span><span class="dots"><i class="f"></i><i></i><i></i></span></div>
      <div class="pc" data-t="A-046"><span class="num">A-046</span><span class="dots"><i></i><i></i><i></i></span></div>
    </div>
  </section>

  <div class="promo">
    <img src="assets/food/ghee-podi-thatte-idli.jpg" alt="">
    <div><div class="t">Ghee Podi Thatte Idli</div><div class="hi">घी में डूबी, पोडी में लिपटी। आपकी सुबह बना देगी।</div></div>
    <div class="p"><s>₹109</s><b>₹94</b></div>
    <div class="dots"><i class="on"></i><i></i><i></i></div>
  </div>
</div>
<script>
  // Demo hook: move a token from "On the tawa" to the hero Ready slot.
  window.demo = {
    ready(tok, name) {
      const card = document.querySelector(`.pc[data-t="${tok}"]`);
      if (card) { card.classList.add('leaving'); setTimeout(() => card.remove(), 500); }
      const hero = document.querySelector('#hero .tkt');
      const more = document.getElementById('more');
      // previous hero slides down into the smaller row
      const prev = hero.cloneNode(true); prev.classList.remove('pop');
      more.insertBefore(prev, more.firstChild);
      if (more.children.length > 2) more.lastElementChild.remove();
      hero.querySelector('.num').textContent = tok;
      hero.querySelector('.nm').textContent = name || 'Table order';
      hero.classList.remove('pop'); void hero.offsetWidth; hero.classList.add('pop');
      document.querySelector('.callout').innerHTML = `<b>${name || ''}</b>${name ? ', आपका' : 'आपका'} ऑर्डर <b>तैयार</b> है!<small>Please collect from the counter</small>`;
    }
  };
  const q = new URLSearchParams(location.search);
  if (q.get('ready')) demo.ready(q.get('ready'), q.get('name'));
</script>
</body>
</html>
