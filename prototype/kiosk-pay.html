<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<title>Benne 14 — Payment method</title>
<link rel="stylesheet" href="theme.css">
<style>
  .screen{display:flex;flex-direction:column;padding:28px 32px 28px}
  .back{align-self:flex-start;height:64px;padding:0 22px 0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--s1);color:var(--cream);font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
  .back span{font-size:26px;line-height:1}
  .amount{margin:70px 0 8px}
  .amount .eyebrow{font-size:14px}
  .amount b{display:block;font-family:var(--display);font-weight:900;font-size:200px;line-height:.82;color:var(--benne);margin-top:10px}
  .amount .hi{font-size:32px;margin-top:12px}
  .summary{display:flex;gap:10px;margin:26px 0 48px}
  .summary span{height:40px;padding:0 14px;display:flex;align-items:center;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:15px;color:var(--cream-2)}

  .opts{display:flex;flex-direction:column;gap:20px}
  .opt{border-radius:20px;border:1.5px solid var(--line);background:var(--s1);padding:34px 28px;display:grid;grid-template-columns:76px 1fr auto;gap:22px;align-items:center;text-align:left;color:var(--cream)}
  .opt .ic{width:76px;height:76px;border-radius:16px;background:var(--s2);display:grid;place-items:center}
  .opt .ic svg{width:42px;height:42px}
  .opt h2{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;text-transform:uppercase}
  .opt .hi{font-size:19px;color:var(--cream-2);margin-top:4px}
  .opt p{font-size:15px;color:var(--cream-3);margin-top:8px;line-height:1.4}
  .opt .go{width:64px;height:64px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:28px}
  .opt.rec{border-color:var(--benne);background:linear-gradient(180deg,rgba(245,197,66,.12),rgba(245,197,66,.03))}
  .opt.rec .ic{background:var(--benne);color:var(--benne-ink)}
  .opt.rec .go{background:var(--benne);border-color:var(--benne);color:var(--benne-ink)}
  .tag{display:inline-block;margin-left:10px;vertical-align:middle;background:var(--leaf);color:#0F1A12;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;padding:5px 9px;border-radius:6px}
  .apps{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .apps span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;background:var(--s2);color:var(--cream-2)}
  .trust{margin-top:auto;display:flex;justify-content:center;gap:26px;font-size:14px;color:var(--cream-3)}
  .trust span::before{content:"✓  ";color:var(--leaf);font-weight:700}
</style>
</head>
<body>
<div class="screen">
  <button class="back"><span>←</span>Order</button>
  <div class="amount">
    <div class="eyebrow">Amount to pay</div>
    <b>₹330</b>
    <div class="hi">कैसे पे करना चाहेंगे?</div>
  </div>
  <div class="summary"><span>3 items</span><span>Takeaway</span><span>For Rahul</span><span style="color:var(--chilli)">You saved ₹48</span></div>

  <div class="opts">
    <button class="opt rec">
      <span class="ic"><svg viewBox="0 0 42 42" fill="currentColor"><path d="M4 4h14v14H4zM8 8v6h6V8zM24 4h14v14H24zm4 4v6h6V8zM4 24h14v14H4zm4 4v6h6v-6zM24 24h5v5h-5zm9 0h5v5h-5zm-9 9h5v5h-5zm9 0h5v5h-5zm-4.5-4.5h5v5h-5z"/></svg></span>
      <div><h2>UPI <span class="tag">FASTEST</span></h2><div class="hi">किसी भी UPI ऐप से स्कैन करें</div>
        <div class="apps"><span>Google Pay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span><span>Any UPI app</span></div></div>
      <span class="go">→</span>
    </button>
    <button class="opt">
      <span class="ic"><svg viewBox="0 0 42 42" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="9" width="34" height="24" rx="4"/><path d="M4 16h34M10 26h8"/></svg></span>
      <div><h2>Card</h2><div class="hi">डेबिट / क्रेडिट कार्ड</div><p>Tap or insert on the card machine at the counter.</p></div>
      <span class="go">→</span>
    </button>
    <button class="opt">
      <span class="ic"><svg viewBox="0 0 42 42" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="36" height="20" rx="3"/><circle cx="21" cy="21" r="5"/><path d="M9 16v10M33 16v10"/></svg></span>
      <div><h2>Cash</h2><div class="hi">काउंटर पर नकद दें</div><p>Get your token now, pay at the counter. We start cooking once paid.</p></div>
      <span class="go">→</span>
    </button>
  </div>

  <div class="trust"><span>Bill with GST</span><span>Instant e-receipt</span><span>Auto-refund if anything fails</span></div>
</div>
</body>
</html>
