<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<title>Benne 14 — Kiosk menu</title>
<link rel="stylesheet" href="theme.css">
<style>
  .screen{display:flex}
  aside{width:168px;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:30px 0 0}
  .brand{padding:0 22px 26px;border-bottom:1px solid var(--line)}
  .brand .w{font-family:var(--display);font-size:52px;line-height:.82;font-weight:900;text-transform:uppercase}
  .brand .w i{font-style:normal;color:var(--benne)}
  .brand small{display:block;margin-top:10px;font-size:11px;color:var(--cream-3);letter-spacing:.12em;text-transform:uppercase;line-height:1.4}
  .cats{flex:1;display:flex;flex-direction:column;padding-top:10px}
  .cat{padding:20px 22px;position:relative;color:var(--cream-3)}
  .cat .n{font-size:30px;line-height:.95}
  .cat .k{font-size:17px;margin-top:6px}
  .cat.on{color:var(--cream);background:var(--s2)}
  .cat.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;background:var(--benne)}
  .rail-foot{padding:18px 18px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .type{background:var(--cream);color:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
  .type b{display:block;font-size:17px}
  .type small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang span{flex:1;text-align:center;padding:9px 0;font-size:14px;color:var(--cream-2)}
  .lang span.on{background:var(--s3);color:var(--cream);font-weight:600}

  main{flex:1;overflow:hidden;position:relative}
  .hero{height:440px;position:relative}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,16,.05) 25%,rgba(18,18,16,.9) 84%,var(--bg))}
  .hero .txt{position:absolute;left:30px;right:30px;bottom:22px;z-index:1}
  .hero h1{font-size:84px;line-height:.82;margin:14px 0 12px}
  .hero .meta{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .hero p{font-size:18px;max-width:330px;line-height:1.45;color:var(--cream)}
  .offer{position:absolute;top:22px;right:22px;z-index:1;width:108px;height:108px;border-radius:50%;background:var(--chilli);color:var(--cream);display:grid;place-items:center;text-align:center;transform:rotate(10deg)}
  .offer b{font-family:var(--display);font-size:44px;line-height:.85;display:block;font-weight:900}
  .offer small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}

  .list{padding:8px 30px 160px}
  .sec{display:flex;align-items:baseline;gap:12px;margin:20px 0 4px}
  .sec h3{font-size:38px}
  .sec .hi{color:var(--cream-3);font-size:22px}
  .item{display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
  .item .ph{width:150px;height:150px;border-radius:12px;overflow:hidden;background:var(--s2)}
  .item .ph img{width:100%;height:100%;object-fit:cover}
  .item h4{font-size:23px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .item .k{font-size:16px;color:var(--benne);opacity:.85;margin:2px 0 6px}
  .item p{font-size:17px;line-height:1.45;margin-bottom:8px}
  .item .price{font-size:28px}

  .cartbar{position:absolute;left:18px;right:18px;bottom:18px;height:100px;background:var(--benne);color:var(--benne-ink);border-radius:16px;display:flex;align-items:center;padding:0 22px 0 26px;gap:18px}
  .cartbar .count{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .cartbar .count b{display:block;font-family:var(--display);font-size:48px;line-height:.85;font-weight:900}
  .cartbar .go{margin-left:auto;display:flex;align-items:center;gap:16px}
  .cartbar .go small{font-size:14px;font-weight:700;letter-spacing:.12em;opacity:.7}
  .cartbar .tot{font-family:var(--display);font-weight:900;font-size:44px}
  .cartbar .arrow{width:62px;height:62px;border-radius:12px;background:var(--benne-ink);color:var(--benne);display:grid;place-items:center;font-size:28px}
  .shade{position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(to bottom,rgba(18,18,16,0),var(--bg) 60%)}
</style>
</head>
<body>
<div class="screen">
  <aside>
    <div class="brand"><div class="w">Benne<br><i>14</i></div><small>Authentic<br>Bangalore Dosa</small></div>
    <div class="cats" id="cats"></div>
    <div class="rail-foot">
      <div class="type"><b>Takeaway</b><small>Change</small></div>
      <div class="lang"><span class="on">EN</span><span class="hi">हिंदी</span></div>
    </div>
  </aside>
  <main>
    <section class="hero" id="hero"></section>
    <section class="list" id="list"></section>
    <div class="shade"></div>
    <div class="cartbar">
      <div class="count"><b id="cc"></b>items</div>
      <div class="go"><small>VIEW ORDER</small><span class="tot" id="ct"></span><span class="arrow">→</span></div>
    </div>
  </main>
</div>
<script src="menu.js"></script>
<script>
  const M = window.MENU, C = window.DEMO_CART;
  const img = (it) => it.nophoto ? `<div class="nophoto">कॉफ़ी</div>` : `<img src="assets/food/${it.id}.jpg" alt="">`;
  const act = (it) => C[it.id] ? `<div class="step"><button>−</button><span>${C[it.id]}</span><button>+</button></div>` : `<button class="add">+</button>`;
  document.getElementById('cats').innerHTML = M.categories.map((c,i)=>`<div class="cat ${i==0?'on':''}"><div class="n disp">${c.name}</div><div class="k hi">${c.hi}</div></div>`).join('');
  const sp = M.items.find(i=>i.special);
  document.getElementById('hero').innerHTML = `${img(sp)}<div class="offer"><div><b>14%</b><small>Launch<br>off</small></div></div>
    <div class="txt"><span class="chip">House special</span><h1 class="disp">Ghee Podi<br>Benne Dosa</h1>
    <div class="meta"><p class="hdesc">${sp.desc}</p><div style="display:flex;align-items:center;gap:16px;flex-shrink:0"><div><span class="price">₹${sp.price}</span><span class="mrp">₹${sp.mrp}</span></div>${act(sp)}</div></div></div>`;
  let h='';
  for (const c of M.categories) {
    const its = M.items.filter(i=>i.cat==c.id && !i.special);
    h += `<div class="sec"><h3 class="disp">${c.name}</h3><span class="hi">${c.hi}</span></div>` + its.map(it=>`
      <div class="item"><div class="ph">${img(it)}</div><div><h4>${it.name}</h4><div class="k hi">${it.hi}</div><p class="hdesc">${it.desc}</p>
      <span class="price">₹${it.price}</span><span class="mrp">₹${it.mrp}</span></div>${act(it)}</div>`).join('');
  }
  document.getElementById('list').innerHTML = h;
  document.getElementById('cc').textContent = Object.values(C).reduce((a,b)=>a+b,0);
  document.getElementById('ct').textContent = '₹'+Object.entries(C).reduce((a,[k,q])=>a+M.items.find(i=>i.id==k).price*q,0);
</script>
</body>
</html>
