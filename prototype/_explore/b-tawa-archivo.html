<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<title>Benne 14 — Direction B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+Kannada:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121210; --s1:#1C1B17; --s2:#26241F; --line:#34312A;
    --cream:#F4ECDD; --cream-2:#B8AE9C; --cream-3:#7D7566;
    --benne:#F5C542; --leaf:#4E8B5F; --chilli:#E2603F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--cream);font-family:Archivo,sans-serif;font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
  .screen{width:800px;height:1280px;position:relative;overflow:hidden;display:flex}
  .cond{font-variation-settings:"wdth" 62;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
  .kn{font-family:"Noto Sans Kannada",sans-serif}

  /* left rail */
  aside{width:168px;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 0 0}
  .brand{padding:0 22px 26px;border-bottom:1px solid var(--line)}
  .brand .w{font-size:44px;line-height:.85;font-variation-settings:"wdth" 62;font-weight:900;letter-spacing:-.01em}
  .brand .w i{font-style:normal;color:var(--benne)}
  .brand small{display:block;margin-top:8px;font-size:11px;color:var(--cream-3);letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
  .cats{flex:1;display:flex;flex-direction:column;padding-top:10px}
  .cat{padding:20px 22px;position:relative;color:var(--cream-3)}
  .cat .n{font-size:26px;line-height:1}
  .cat .k{font-size:13px;margin-top:6px}
  .cat.on{color:var(--cream);background:var(--s2)}
  .cat.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;background:var(--benne)}
  .rail-foot{padding:18px 22px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--cream-2);display:flex;flex-direction:column;gap:10px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;text-align:center}
  .pill.on{background:var(--cream);color:var(--bg);border-color:var(--cream);font-weight:700}

  main{flex:1;overflow:hidden;position:relative}
  .hero{height:430px;position:relative}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,16,.1) 30%,rgba(18,18,16,.92) 88%,var(--bg))}
  .hero .txt{position:absolute;left:30px;right:30px;bottom:22px;z-index:1}
  .chip{display:inline-block;background:var(--benne);color:var(--bg);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px}
  .hero h1{font-size:68px;line-height:.86;margin:12px 0 10px}
  .hero .meta{display:flex;align-items:center;justify-content:space-between}
  .hero p{font-size:15px;color:var(--cream-2);max-width:330px;line-height:1.4}
  .offer{position:absolute;top:22px;right:22px;z-index:1;width:104px;height:104px;border-radius:50%;background:var(--chilli);color:var(--cream);display:grid;place-items:center;text-align:center;transform:rotate(10deg)}
  .offer b{font-size:34px;line-height:.9;display:block;font-variation-settings:"wdth" 62;font-weight:900}
  .offer small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

  .price{font-weight:800;font-size:28px;font-variation-settings:"wdth" 80;color:var(--benne)}
  .mrp{font-size:15px;color:var(--cream-3);text-decoration:line-through;margin-left:8px}
  .step{display:flex;align-items:center;background:var(--benne);color:var(--bg);border-radius:10px;height:56px}
  .step button{width:54px;height:56px;border:0;background:none;font-size:28px;font-weight:700;color:var(--bg)}
  .step span{min-width:24px;text-align:center;font-weight:800;font-size:20px}
  .add{height:56px;width:56px;border-radius:10px;border:1.5px solid var(--benne);background:none;color:var(--benne);font-size:30px;font-weight:500}

  .list{padding:8px 30px 160px}
  .sec{display:flex;align-items:baseline;gap:12px;margin:18px 0 6px}
  .sec h3{font-size:30px}
  .sec .kn{color:var(--cream-3);font-size:14px}
  .item{display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
  .item .ph{width:150px;height:150px;border-radius:12px;overflow:hidden;background:var(--s2);position:relative}
  .item .ph img{width:100%;height:100%;object-fit:cover}
  .item h4{font-size:22px;font-weight:700;font-variation-settings:"wdth" 88;line-height:1.1}
  .item .k{font-size:13px;color:var(--cream-3);margin:4px 0 8px}
  .item p{font-size:14px;color:var(--cream-2);line-height:1.4;margin-bottom:10px}
  .item .price{font-size:24px}
  .nophoto{width:100%;height:100%;display:grid;place-items:center;color:var(--benne);font-size:30px}

  .cartbar{position:absolute;left:18px;right:18px;bottom:18px;height:100px;background:var(--benne);color:var(--bg);border-radius:16px;display:flex;align-items:center;padding:0 26px;gap:18px}
  .cartbar .count{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .cartbar .count b{display:block;font-size:40px;line-height:.9;font-variation-settings:"wdth" 62;font-weight:900}
  .cartbar .go{margin-left:auto;font-size:30px;display:flex;align-items:center;gap:14px}
  .cartbar .tot{font-variation-settings:"wdth" 80;font-weight:800;font-size:34px}
  .cartbar .arrow{width:60px;height:60px;border-radius:12px;background:var(--bg);color:var(--benne);display:grid;place-items:center;font-size:28px}
  .shade{position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(to bottom,rgba(18,18,16,0),var(--bg) 60%)}
</style>
</head>
<body>
<div class="screen">
  <aside>
    <div class="brand"><div class="w">BENNE<br><i>14</i></div><small>Authentic<br>Bangalore Dosa</small></div>
    <div class="cats" id="cats"></div>
    <div class="rail-foot">
      <div class="pill on">Takeaway</div>
      <div class="pill">EN · ಕ · हि</div>
    </div>
  </aside>
  <main>
    <section class="hero" id="hero"></section>
    <section class="list" id="list"></section>
    <div class="shade"></div>
    <div class="cartbar">
      <div class="count"><b id="cc"></b>items</div>
      <div class="go"><span style="font-size:15px;font-weight:600;opacity:.75">VIEW ORDER</span><span class="tot" id="ct"></span><span class="arrow">→</span></div>
    </div>
  </main>
</div>
<script src="menu.js"></script>
<script>
  const M = window.MENU, C = window.DEMO_CART;
  const img = (it) => it.nophoto ? `<div class="nophoto kn">ಕಾಫಿ</div>` : `<img src="assets/food/${it.id}.jpg" alt="">`;
  const act = (it) => C[it.id] ? `<div class="step"><button>−</button><span>${C[it.id]}</span><button>+</button></div>` : `<button class="add">+</button>`;
  document.getElementById('cats').innerHTML = M.categories.map((c,i)=>`<div class="cat ${i==0?'on':''}"><div class="n cond">${c.name}</div><div class="k kn">${c.kn}</div></div>`).join('');
  const sp = M.items.find(i=>i.special);
  document.getElementById('hero').innerHTML = `${img(sp)}<div class="offer"><div><b>14%</b><small>Launch<br>off</small></div></div>
    <div class="txt"><span class="chip">House special</span><h1 class="cond">Ghee Podi<br>Benne Dosa</h1>
    <div class="meta"><p>${sp.desc}</p><div style="display:flex;align-items:center;gap:16px"><div><span class="price">₹${sp.price}</span><span class="mrp">₹${sp.mrp}</span></div>${act(sp)}</div></div></div>`;
  let h='';
  for (const c of M.categories) {
    const its = M.items.filter(i=>i.cat==c.id && !i.special);
    h += `<div class="sec"><h3 class="cond">${c.name}</h3><span class="kn">${c.kn}</span></div>` + its.map(it=>`
      <div class="item"><div class="ph">${img(it)}</div><div><h4>${it.name}</h4><div class="k kn">${it.kn}</div><p>${it.desc}</p>
      <span class="price">₹${it.price}</span><span class="mrp">₹${it.mrp}</span></div>${act(it)}</div>`).join('');
  }
  document.getElementById('list').innerHTML = h;
  document.getElementById('cc').textContent = Object.values(C).reduce((a,b)=>a+b,0);
  document.getElementById('ct').textContent = '₹'+Object.entries(C).reduce((a,[k,q])=>a+M.items.find(i=>i.id==k).price*q,0);
</script>
</body>
</html>
